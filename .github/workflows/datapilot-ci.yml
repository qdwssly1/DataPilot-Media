name: DataPilot CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "datapilot/**"
      - "tests/datapilot/**"
      - ".github/workflows/datapilot-ci.yml"
  push:
    branches:
      - main
    paths:
      - "datapilot/**"
      - "tests/datapilot/**"
      - ".github/workflows/datapilot-ci.yml"
  workflow_dispatch:

jobs:
  test:
    name: Python 3.13 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependency
        run: python -m pip install pytest==9.1.1
      - name: Run DataPilot tests
        run: python -m pytest tests/datapilot -v

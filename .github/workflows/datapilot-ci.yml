name: DataPilot CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "datapilot/**"
      - "domains/media/**"
      - "evals/datapilot/**"
      - "evals/media/**"
      - "tests/datapilot/**"
      - "tests/media/**"
      - "core/wren/pyproject.toml"
      - "core/wren/uv.lock"
      - "sdk/wren-langchain/**"
      - ".github/workflows/datapilot-ci.yml"
  push:
    branches:
      - main
    paths:
      - "datapilot/**"
      - "domains/media/**"
      - "evals/datapilot/**"
      - "evals/media/**"
      - "tests/datapilot/**"
      - "tests/media/**"
      - "core/wren/pyproject.toml"
      - "core/wren/uv.lock"
      - "sdk/wren-langchain/**"
      - ".github/workflows/datapilot-ci.yml"
  workflow_dispatch:

jobs:
  test:
    name: Python 3.13 tests
    runs-on: ubuntu-latest
    env:
      MEDIA_DUCKDB_DIR: ${{ github.workspace }}/domains/media/data
      WREN_HOME: ${{ github.workspace }}/domains/media/.wren
      WREN_PROJECT_PATH: ${{ github.workspace }}/domains/media
      WREN_PROFILE: datapilot_media_duckdb
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.17"
      - name: Install project and offline test dependencies
        run: |
          uv sync --project core/wren --locked --extra mcp --python 3.13
          uv pip install --python core/wren/.venv/bin/python -e ./sdk/wren-langchain
      - name: Verify offline test dependencies
        run: >-
          uv run --project core/wren --no-sync python -c
          "import anyio, duckdb, dotenv, httpx, mcp, pydantic, pytest,
          sqlglot, wren, wren_core, wren_langchain;
          print('offline test dependencies OK')"
      - name: Generate synthetic Media data
        run: >-
          uv run --project core/wren --no-sync python
          domains/media/data/generate_data.py
      - name: Configure Media DuckDB profile
        run: >-
          uv run --project core/wren --no-sync wren profile add
          datapilot_media_duckdb --from-file domains/media/profile.yml
      - name: Build and validate Media Wren context
        run: |
          uv run --project core/wren --no-sync wren context build --path domains/media
          uv run --project core/wren --no-sync wren context validate --path domains/media
          test -f domains/media/target/mdl.json
      - name: Run DataPilot tests
        run: uv run --project core/wren --no-sync python -m pytest tests/datapilot -v
      - name: Run Media tests
        run: uv run --project core/wren --no-sync python -m pytest tests/media -v
